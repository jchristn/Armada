services:
  armada-proxy:
    build:
      context: ../..
      dockerfile: src/Armada.Proxy/Dockerfile
    ports:
      - "7893:7893"
    environment:
      - ARMADA_PROXY_SETTINGS_FILE=/config/proxysettings.json
      - ARMADA_PROXY_PASSWORD=${ARMADA_PROXY_PASSWORD:?Set ARMADA_PROXY_PASSWORD (the shared proxy and tunnel password; use the same value as RemoteControl.Password on each Armada instance) before starting}
    volumes:
      - ./proxysettings.json:/config/proxysettings.json:ro
      - ./data:/app/data
      - ./logs:/app/data/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7893/proxy-api/v1/status/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
