services:
  armada-server:
    # Published release image. To run a locally built image instead, build it with this tag first
    # (scripts/common/build-*.sh) or change the tag.
    image: jchristn77/armada-server:v1.0.0
    ports:
      - "7890:7890"
      - "7891:7891"
      - "9464:9464"
    environment:
      # The Admiral listens on 0.0.0.0 in the container and refuses to start while the default admin
      # password is in use. Set this before the first start (for example in a .env file next to this file).
      - ARMADA_INITIAL_ADMIN_PASSWORD=${ARMADA_INITIAL_ADMIN_PASSWORD:?Set ARMADA_INITIAL_ADMIN_PASSWORD (8+ characters) before the first start}
      # - GIT_CONFIG_GLOBAL=/app/data/gitconfig
    volumes:
      - ./armada.json:/app/data/settings.json
      - ./db:/app/data/db
      - ./logs:/app/data/logs
      # To use a host checkout as a vessel, mount it and trust its container path in a gitconfig named by
      # GIT_CONFIG_GLOBAL (it is owned by your host user, not the container's UID 1654, and git refuses it
      # otherwise). See docs/DOCKER.md, "Vessels from repositories mounted into the container".
      # - ./gitconfig:/app/data/gitconfig:ro
      # - /path/to/myproject:/repos/myproject
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7890/api/v1/status/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
    depends_on:
      # The Admiral pushes its logs to Loki (telemetry.lokiEndpoint in armada.json).
      loki:
        condition: service_healthy

  armada-dashboard:
    image: jchristn77/armada-dashboard:v1.0.0
    ports:
      - "3000:8080"
    environment:
      - ARMADA_SERVER_URL=http://armada-server:7890
    healthcheck:
      # nginx-unprivileged listens on 8080 inside the container.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/dashboard/"]
      interval: 5s
      timeout: 3s
      retries: 2
    depends_on:
      armada-server:
        condition: service_healthy

  # --- Observability stack (Prometheus / Loki / Grafana) ---
  # Prometheus scrapes the Admiral's in-process /metrics endpoint (port 9464); Loki receives logs
  # pushed by the Admiral's telemetry host; Grafana visualizes both via provisioned datasources.
  # The Prometheus and Loki images ship without curl (busybox only), so their healthchecks use the
  # busybox wget against the same 127.0.0.1 endpoint; Grafana's image includes curl.

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 2
    depends_on:
      armada-server:
        condition: service_healthy

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    healthcheck:
      # /ready returns 503 for roughly 15 seconds after start while the ingester warms up;
      # start_period keeps those early probes from counting against the retry budget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 45s

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
