# Split-mode deployment: the Admiral runs in a container while captains execute on the developer's
# machine through a host-side Harbor runner. No agent CLIs are baked into the server image -- they live
# on the Harbor, which dials out to the Admiral over the published link port (7890) and reaches the
# advertised MCP endpoint (127.0.0.1:7891, published below) to call home.
#
# Bring the Admiral up with this profile, then start the Harbor app on the host and set its link URL
# (ServerLinkUrl) to ws://127.0.0.1:7890/v1.0/harbor/connect. The containerized Admiral listens on
# 0.0.0.0 and sees the Harbor as a non-loopback peer, so the Harbor must also present an Armada
# credential (AccessKey, sent as x-access-key; mint one in the dashboard or with the REST API).
# Standalone/local mode remains the default and does not need Docker at all (see compose.yaml).
services:
  armada-server:
    # Published release image. To run a locally built image instead, build it with this tag first
    # (scripts/common/build-*.sh) or change the tag.
    image: jchristn77/armada-server:v1.0.0
    ports:
      # 7890: Admiral REST + WebSocket (the Harbor link). 7891: MCP (captain call-home). 9464: metrics.
      - "7890:7890"
      - "7891:7891"
      - "9464:9464"
    environment:
      # The Admiral listens on 0.0.0.0 in the container and refuses to start while the default admin
      # password is in use. Set this before the first start (for example in a .env file next to this file).
      - ARMADA_INITIAL_ADMIN_PASSWORD=${ARMADA_INITIAL_ADMIN_PASSWORD:?Set ARMADA_INITIAL_ADMIN_PASSWORD (8+ characters) before the first start}
    volumes:
      - ./armada.split.json:/app/data/settings.json
      - ./db:/app/data/db
      - ./logs:/app/data/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7890/api/v1/status/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy

  # --- Observability stack (Prometheus / Loki / Grafana) ---
  # The Prometheus and Loki images ship without curl (busybox only), so their healthchecks use the
  # busybox wget against the same 127.0.0.1 endpoint; Grafana's image includes curl.
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 2
    depends_on:
      armada-server:
        condition: service_healthy

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    healthcheck:
      # /ready returns 503 for roughly 15 seconds after start while the ingester warms up;
      # start_period keeps those early probes from counting against the retry budget.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 45s

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
