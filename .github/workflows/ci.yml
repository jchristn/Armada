name: ci

# Runs on every push and pull request. Four jobs:
#   build-and-test  Windows, macOS, and Linux x net8.0 and net10.0: warning-free build plus Test.Automated.
#   dashboard       npm ci, build, Vitest, and a check that the committed dist/ matches a fresh build.
#   tui-parity      The TUI parity manifest is current and has no planned entries.
#   compose         Validates every Docker compose file parses.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NODE_VERSION: "24"

jobs:
  # ------------------------------------------------------------------
  # .NET build (warnings are errors) and the full Touchstone suite.
  # ------------------------------------------------------------------
  build-and-test:
    name: test (${{ matrix.os }}, ${{ matrix.framework }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The git-backed suites (docks, landing, merge queue) commit into scratch repositories.
      - name: Configure git for test repositories
        shell: bash
        run: |
          git config --global user.name "Armada CI"
          git config --global user.email "ci@armada.invalid"
          git config --global init.defaultBranch main
          git config --global core.longpaths true

      - name: Restore
        run: dotnet restore src/Armada.sln

      # The solution builds with zero warnings today, so any new compiler warning fails the build.
      # NuGet audit advisories (NU190x) stay visible as warnings but do not fail CI: a newly published
      # advisory is not a defect in the change under test. Dependency scanning is tracked separately.
      - name: Build (warnings as errors)
        run: dotnet build src/Armada.sln -c Release --no-restore -warnaserror -warnnotaserror:NU1900,NU1901,NU1902,NU1903,NU1904

      - name: Test.Automated (${{ matrix.framework }})
        shell: bash
        run: |
          mkdir -p test-results
          dotnet run --project src/Test.Automated -c Release --no-build --framework ${{ matrix.framework }} -- \
            --results "test-results/test-automated-${{ matrix.os }}-${{ matrix.framework }}.json"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: test-results/
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # Dashboard: install, build, test, and verify the committed dist/.
  # Runs on Linux only so line endings match the committed files.
  # ------------------------------------------------------------------
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/Armada.Dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/Armada.Dashboard/package-lock.json

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

      # dist/ is committed on purpose (deploy scripts fall back to it when Node is absent), so a change
      # to dashboard source without a rebuilt dist/ ships a stale dashboard. Fail when they differ.
      - name: Verify committed dist/ matches a fresh build
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- dist)"
          if [ -n "$changes" ]; then
            echo "::error::src/Armada.Dashboard/dist is out of date. Run 'npm ci && npm run build' in src/Armada.Dashboard and commit dist/."
            echo "$changes"
            git --no-pager diff --stat -- dist
            exit 1
          fi
          echo "dist/ matches a fresh build."

  # ------------------------------------------------------------------
  # TUI parity gate: src/Armada.Tui/parity.json matches the dashboard
  # source, has no "planned" entries, and every not-applicable or
  # extension entry has notes (TUI_APP_PLAN.md W8.1). Tui.Parity in
  # Test.Automated enforces the same rules on every OS.
  # ------------------------------------------------------------------
  tui-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: TUI parity manifest (no planned entries)
        run: python3 scripts/tui/generate-parity-manifest.py --check

  # ------------------------------------------------------------------
  # Compose files: parse and validate (no images are pulled or built).
  # ------------------------------------------------------------------
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The compose files require secrets with ${VAR:?message} so a real deployment cannot start without them.
      # Validation supplies placeholder values for those variables only, in this step's commands only, and then
      # proves the requirement still holds: each file must still refuse to render when its secret is unset.
      - name: Validate compose files
        shell: bash
        run: |
          set -euo pipefail
          placeholder="ci-validation-placeholder"
          for f in docker/armada/compose.yaml docker/armada/compose.split.yaml docker/proxy/compose.yaml; do
            echo "== $f"
            ARMADA_INITIAL_ADMIN_PASSWORD="$placeholder" ARMADA_PROXY_PASSWORD="$placeholder" \
              docker compose -f "$f" config --quiet
          done

          # Each file rendered above with every placeholder set, so a failure with only one variable unset can
          # only come from that variable: no need to read docker's error text.
          check_required() {
            local file="$1" var="$2"
            if ARMADA_INITIAL_ADMIN_PASSWORD="$placeholder" ARMADA_PROXY_PASSWORD="$placeholder" \
              env -u "$var" docker compose -f "$file" config --quiet >/dev/null 2>&1; then
              echo "::error::$file renders without $var; the secret must stay required."
              exit 1
            fi
            echo "$file still requires $var"
          }
          check_required docker/armada/compose.yaml ARMADA_INITIAL_ADMIN_PASSWORD
          check_required docker/armada/compose.split.yaml ARMADA_INITIAL_ADMIN_PASSWORD
          check_required docker/proxy/compose.yaml ARMADA_PROXY_PASSWORD
