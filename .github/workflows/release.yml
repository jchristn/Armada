name: release

# A release is one action: push a tag (v1.2.3) or dispatch with a version.
# Each OS job builds, signs, packages, and uploads only the channels it owns.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without leading v), e.g. 0.9.1"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  # ------------------------------------------------------------------
  # Resolve the version once so every OS job packages the same string.
  # ------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - id: derive
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Windows: Inno (.exe) for Harbor + WiX (.msi) for the server.
  # ------------------------------------------------------------------
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install packaging tools
        run: |
          choco install innosetup -y
          dotnet tool install --global wix
      - name: Build the publisher
        run: dotnet build src/Armada.Publisher/Armada.Publisher.csproj -c Release
      - name: Preflight
        run: dotnet run --project src/Armada.Publisher -c Release -- doctor
      - name: Package Windows channels
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          dotnet run --project src/Armada.Publisher -c Release -- --channel inno-harbor --version ${{ needs.version.outputs.version }}
          dotnet run --project src/Armada.Publisher -c Release -- --channel wix-server   --version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/**/*

  # ------------------------------------------------------------------
  # macOS: .app + .dmg (Harbor) and .pkg (server); notarize + staple.
  # ------------------------------------------------------------------
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # hdiutil, sips, iconutil, codesign, pkgbuild, productbuild, and xcrun ship with macos-latest.
      - name: Build the publisher
        run: dotnet build src/Armada.Publisher/Armada.Publisher.csproj -c Release
      - name: Preflight
        run: dotnet run --project src/Armada.Publisher -c Release -- doctor
      - name: Package macOS channels
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          dotnet run --project src/Armada.Publisher -c Release -- --channel dmg-harbor  --version ${{ needs.version.outputs.version }}
          dotnet run --project src/Armada.Publisher -c Release -- --channel pkg-server  --version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/**/*

  # ------------------------------------------------------------------
  # Linux: .deb/.rpm for the CLI, Harbor, and server.
  # ------------------------------------------------------------------
  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install packaging tools
        run: |
          sudo gem install --no-document fpm
          sudo apt-get update && sudo apt-get install -y rpm
      - name: Build the publisher
        run: dotnet build src/Armada.Publisher/Armada.Publisher.csproj -c Release
      - name: Preflight
        run: dotnet run --project src/Armada.Publisher -c Release -- doctor
      - name: Package Linux channels
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          REPO_SYNC_CREDENTIALS: ${{ secrets.REPO_SYNC_CREDENTIALS }}
        run: |
          dotnet run --project src/Armada.Publisher -c Release -- --channel linux-cli     --version ${{ needs.version.outputs.version }}
          dotnet run --project src/Armada.Publisher -c Release -- --channel linux-harbor  --version ${{ needs.version.outputs.version }}
          dotnet run --project src/Armada.Publisher -c Release -- --channel linux-server  --version ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/**/*

  # ------------------------------------------------------------------
  # NuGet global tool: OS-agnostic, runs once.
  # ------------------------------------------------------------------
  nuget:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish CLI as a dotnet tool
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet run --project src/Armada.Publisher -c Release -- --channel nuget-cli --version ${{ needs.version.outputs.version }}

  # ------------------------------------------------------------------
  # Collect every OS's installers, write one SHA256SUMS covering all of
  # them, and attach both to the GitHub Release.
  # ------------------------------------------------------------------
  release:
    needs: [version, windows, macos, linux, nuget]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten installers and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -path '*/packages/*' -not -path '*/_work/*' \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.pkg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.nupkg' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
      - name: Note signing state
        run: |
          echo "Installers are signed only when the WINDOWS_CERT_* and APPLE_* secrets are set."
          echo "If they were not, the release notes must carry the unsigned-installer notice (docs/RELEASING.md)."
