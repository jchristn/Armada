# nginx template for the standalone dashboard image. The image entrypoint renders it to
# /etc/nginx/conf.d/default.conf at startup, substituting ${ARMADA_SERVER_URL} (default
# http://armada-server:7890; set it on the container to point somewhere else).
#
# The React build uses the base path /dashboard/ (the Admiral serves the same build there), and it
# calls the API, the WebSocket, and a few shared assets (/img, /dashboard/i18n) on its own origin.
# So this server hosts the build under /dashboard/ and proxies everything else to the Admiral.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    location = / {
        return 302 /dashboard/;
    }

    # Translations ship with the Admiral, not with the React build.
    location /dashboard/i18n/ {
        proxy_pass ${ARMADA_SERVER_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA: real files, otherwise index.html for client-side routes.
    location /dashboard/ {
        try_files $uri /dashboard/index.html;
    }

    # REST API, WebSocket (/ws), OpenAPI, images: the Admiral.
    location / {
        proxy_pass ${ARMADA_SERVER_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 512m;
    }
}
