# Signed in (state kept from 01): walk the tabs, open a few dashboard routes, the notification center, and the
# preferences; switch the theme.
appId: ${APP_ID}
name: 02-navigate
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-ask"
    timeout: 30000
- tapOn:
    id: "tab-work"
# The Work tab opens on Home (W2.1); the Work destinations follow the overview.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "nav-/missions"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- assertVisible: "OPERATIONS"
- takeScreenshot: work
- tapOn:
    id: "nav-/missions"
- extendedWaitUntil:
    visible:
      id: "missions-list"
    timeout: 10000
# Tapping the active tab pops its stack to the root (works the same on iOS and Android).
- tapOn:
    id: "tab-work"
# Vessels is near the end of the list, so it cannot be scrolled to the center; fully visible is enough.
- scrollUntilVisible:
    element:
      id: "nav-/vessels"
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: "nav-/vessels"
- extendedWaitUntil:
    visible:
      id: "vessels-hub"
    timeout: 10000
- tapOn:
    id: "tab-work"
- tapOn:
    id: "tab-approvals"
- extendedWaitUntil:
    visible:
      id: "approvals"
    timeout: 10000
- takeScreenshot: approvals
- tapOn:
    id: "header-notifications"
- extendedWaitUntil:
    visible: "No notifications"
    timeout: 10000
- takeScreenshot: notifications
- tapOn:
    id: "notifications-close"
- tapOn:
    id: "tab-more"
- extendedWaitUntil:
    visible:
      id: "more-menu"
    timeout: 10000
- assertVisible: "CONFIGURATION"
- scrollUntilVisible:
    element:
      id: "nav-/preferences"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "nav-/preferences"
- extendedWaitUntil:
    visible:
      id: "theme-dark"
    timeout: 10000
- tapOn:
    id: "theme-dark"
- takeScreenshot: preferences-dark
- tapOn:
    id: "theme-system"
- tapOn:
    id: "tab-more"
- assertVisible:
    id: "more-menu"
