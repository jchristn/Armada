# Signed in (state kept from 01): Ask Armada against the throwaway Admiral. The seeded server has no captains, so
# plain messages are disabled and quick actions still work: run /status from the / menu (creates the conversation
# and posts its action result), find it in the conversation list, rename it from the options sheet, start a delete
# from the list and cancel it, leave Ask and come back and type, and delete it from the options sheet.
appId: ${APP_ID}
name: 04-ask
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "ask-screen"
    timeout: 30000
- tapOn:
    id: "tab-ask"
- extendedWaitUntil:
    visible:
      id: "ask-empty"
    timeout: 20000
- assertVisible: "Choose a captain to chat, or start work with a quick action."
- takeScreenshot: ask-empty
- tapOn:
    id: "ask-input"
- runFlow: common/dismiss-keyboard-tips.yaml
- inputText: "/st"
- extendedWaitUntil:
    visible:
      id: "ask-quick-status"
    timeout: 10000
# The keyboard can still be animating in and moving the composer; tap only once the layout has settled.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ask-quick-menu
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "ask-quick-status"
# The composer keeps focus; with the keyboard up a phone transcript shows only the end of the result card (the
# transcript follows the newest message), so wait for the card's end, close the keyboard, and scroll back to the
# result's heading and text.
- extendedWaitUntil:
    visible: "Ran now\\."
    timeout: 30000
- hideKeyboard
- scrollUntilVisible:
    element: "Action result"
    direction: UP
    timeout: 10000
- assertVisible: "Show Armada status: done."
- takeScreenshot: ask-action-result
- tapOn:
    id: "ask-open-options"
- extendedWaitUntil:
    visible:
      id: "ask-options-rename"
    timeout: 10000
- tapOn:
    id: "ask-options-rename"
- extendedWaitUntil:
    visible:
      id: "ask-rename-title"
    timeout: 10000
- eraseText: 60
- inputText: "Mobile E2E"
- tapOn:
    id: "ask-rename-confirm"
- extendedWaitUntil:
    visible: "Mobile E2E"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "ask-open-list"
    commands:
      - tapOn:
          id: "ask-open-list"
      - extendedWaitUntil:
          visible:
            id: "ask-thread-list"
          timeout: 10000
      # The row reads its title and time together.
      - assertVisible: "Mobile E2E.*"
      - takeScreenshot: ask-thread-list
      # Delete from the row menu asks inside the list (it used to ask from the screen behind the list: on iOS
      # nothing appeared, and afterwards the composer could not take focus). Cancel keeps the conversation.
      - longPressOn: "Mobile E2E.*"
      - extendedWaitUntil:
          visible:
            id: "ask-action-delete"
          timeout: 10000
      - tapOn:
          id: "ask-action-delete"
      - extendedWaitUntil:
          visible:
            id: "ask-delete-confirm"
          timeout: 10000
      - tapOn:
          id: "ask-delete-confirm-cancel"
      - tapOn:
          id: "ask-close-list"
# Leave Ask, come back, and type: the composer must still take text.
- tapOn:
    id: "tab-work"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "tab-more"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "tab-ask"
- extendedWaitUntil:
    visible:
      id: "ask-input"
    timeout: 10000
- tapOn:
    id: "ask-input"
# Maestro's hideKeyboard on iOS can leave a newline in the multi-line composer; start from an empty box.
- eraseText: 20
- inputText: "Back on Ask"
- extendedWaitUntil:
    visible: ".*Back on Ask"
    timeout: 10000
- eraseText: 20
- hideKeyboard
- tapOn:
    id: "ask-open-options"
- extendedWaitUntil:
    visible:
      id: "ask-options-delete"
    timeout: 10000
- tapOn:
    id: "ask-options-delete"
- extendedWaitUntil:
    visible: "Delete conversation"
    timeout: 10000
- tapOn:
    id: "ask-delete-confirm-confirm"
- extendedWaitUntil:
    visible:
      id: "ask-empty"
    timeout: 20000
