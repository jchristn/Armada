# iOS simulator only (scripts/mobile/run-e2e.sh --push-sim): sign in to the throwaway Admiral, accept the push
# explanation sheet, and allow notifications in the system dialog. The runner then delivers simulated pushes with
# `xcrun simctl push` (an APNs payload with the Armada data object under "body", as Expo sends it).
appId: ${APP_ID}
name: 01-enable-notifications
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "profile-url"
    timeout: 60000
- tapOn:
    id: "profile-url"
- inputText: ${SERVER_URL}
- pressKey: Enter
- tapOn:
    id: "profile-save"
- extendedWaitUntil:
    visible:
      id: "sign-in-email"
    timeout: 20000
- tapOn:
    id: "sign-in-email"
- inputText: "admin@armada"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "sign-in-password"
    timeout: 20000
- tapOn:
    id: "sign-in-password"
- inputText: "password"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "password-change-skip"
    timeout: 20000
- tapOn:
    id: "password-change-skip"
- tapOn:
    id: "password-skip-confirm-confirm"
- extendedWaitUntil:
    visible:
      id: "push-prompt-enable"
    timeout: 20000
- takeScreenshot: push-explanation
- tapOn:
    id: "push-prompt-enable"
- takeScreenshot: push-system-dialog
# Maestro may answer the system permission alert itself; tap Allow when it is still showing.
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-work"
    timeout: 10000
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      id: "nav-/preferences"
    direction: DOWN
# iOS counts a row the scroll view has clipped (under the tab bar) as visible; lift it clear before tapping.
- swipe:
    start: "50%, 60%"
    end: "50%, 40%"
    duration: 600
- tapOn:
    id: "nav-/preferences"
- scrollUntilVisible:
    element:
      id: "push-status"
    direction: DOWN
# No EAS project id in a local build: permission is granted but there is no Expo token to register.
- assertVisible: ".*no push project configured.*"
- takeScreenshot: push-preferences
- tapOn:
    id: "tab-work"
