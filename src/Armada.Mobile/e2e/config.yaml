# Maestro workspace for the Armada mobile app. scripts/mobile/run-e2e.sh starts a throwaway Admiral and passes
# SERVER_URL (as the device reaches it) and APP_ID, and seeds one deployment awaiting approval plus Operations data
# (a fleet, a vessel, a voyage) and Build data (a fleet with two vessels). The flows run in order: sign in, navigate,
# operations, Ask Armada, approvals, Build (vessels, captains, planning and backlog), the W4 screens (Delivery,
# Configuration, Activity, Settings), sign out.
flows:
  - "0*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 01-sign-in
    - 02-navigate
    - 02-operations
    - 04-ask
    - 05-approvals
    - 06-build-vessels
    - 07-build-captains
    - 08-build-planning
    - 09-w4
    - 03-sign-out
