# Signed in (state kept from 01; 05 approved the seeded deployment "Release 2.3"): the W4 screens on a phone.
# Delivery: the deployment in the Deployments tab and its detail. Configuration: edit the Architect persona's
# description. Activity: the API Requests source and a request's detail. Settings: change the Default Landing Mode
# and save it, then back up through the share sheet.
appId: ${APP_ID}
name: 09-w4
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "tab-ask"
    timeout: 30000
# Delivery: a deployment and its detail.
- tapOn:
    id: "tab-work"
- scrollUntilVisible:
    element:
      id: "nav-/delivery"
    direction: DOWN
    visibilityPercentage: 100
# Nudge it clear of the tab bar (the bottom edge counts as visible behind it).
- swipe:
    start: "50%,60%"
    end: "50%,40%"
    duration: 600
- tapOn:
    id: "nav-/delivery"
- extendedWaitUntil:
    visible:
      id: "delivery-tab-deployments"
    timeout: 10000
- extendedWaitUntil:
    visible: "Release 2.3.*"
    timeout: 15000
- takeScreenshot: w4-delivery-deployments
- tapOn:
    id: "deployment-row-.*"
- extendedWaitUntil:
    visible:
      id: "deployment-title"
    timeout: 10000
- assertVisible: "Release 2.3"
- takeScreenshot: w4-deployment-detail
- tapOn:
    id: "tab-work"
# Configuration: edit a persona.
- tapOn:
    id: "tab-more"
- extendedWaitUntil:
    visible:
      id: "more-menu"
    timeout: 10000
- tapOn:
    id: "nav-/configuration"
- extendedWaitUntil:
    visible:
      id: "configuration-tab-workflow-profiles"
    timeout: 10000
# The tab strip scrolls sideways; bring the Personas tab into view.
- repeat:
    times: 4
    while:
      notVisible:
        id: "configuration-tab-personas"
    commands:
      - swipe:
          from:
            id: "configuration-tabs"
          direction: LEFT
- tapOn:
    id: "configuration-tab-personas"
- extendedWaitUntil:
    visible:
      id: "persona-row-Architect"
    timeout: 15000
- tapOn:
    id: "persona-row-Architect"
- extendedWaitUntil:
    visible:
      id: "persona-edit"
    timeout: 10000
- tapOn:
    id: "persona-edit"
- tapOn:
    id: "persona-form-description"
- eraseText: 400
- inputText: "Edited from the mobile E2E flow"
# On Android this is a back press: it must close only the keyboard, not the sheet with the edit in it.
- hideKeyboard
- assertVisible:
    id: "persona-form-description"
# Save sits in the form sheet's footer, reachable without scrolling.
- assertVisible:
    id: "persona-form-footer"
- tapOn:
    id: "persona-form-submit"
- extendedWaitUntil:
    visible: ".*Edited from the mobile E2E flow.*"
    timeout: 10000
- takeScreenshot: w4-persona-edited
- tapOn:
    id: "tab-more"
# Activity: API requests and one request's detail.
- tapOn:
    id: "tab-more"
- tapOn:
    id: "nav-/activity"
- extendedWaitUntil:
    visible:
      id: "activity-tab-requests"
    timeout: 10000
- takeScreenshot: w4-activity-history
- tapOn:
    id: "activity-tab-requests"
- extendedWaitUntil:
    visible:
      id: "request-row-.*"
    timeout: 15000
- takeScreenshot: w4-activity-requests
- scrollUntilVisible:
    element:
      id: "request-row-.*"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "request-row-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "request-title"
    timeout: 10000
- takeScreenshot: w4-request-detail
- tapOn:
    id: "tab-more"
# Settings: Default Landing Mode, save, and backup through the share sheet.
- tapOn:
    id: "tab-more"
- scrollUntilVisible:
    element:
      id: "nav-/server"
    direction: DOWN
    visibilityPercentage: 100
# Nudge it clear of the tab bar (the bottom edge counts as visible behind it).
- swipe:
    start: "50%,60%"
    end: "50%,40%"
    duration: 600
- tapOn:
    id: "nav-/server"
- extendedWaitUntil:
    visible:
      id: "settings-server"
    timeout: 15000
# The Server tab is long (and its disclosure rows are full touch height); on a loaded host each swipe takes seconds.
- scrollUntilVisible:
    element:
      id: "settings-landing-mode"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 90000
# Nudge it clear of the tab bar (the bottom edge counts as visible behind it).
- swipe:
    start: "50%,60%"
    end: "50%,40%"
    duration: 600
- tapOn:
    id: "settings-landing-mode"
- tapOn:
    id: "settings-landing-mode-option-LocalMerge"
- assertVisible: "Local Merge.*"
- scrollUntilVisible:
    element:
      id: "settings-agent-save"
    direction: DOWN
    visibilityPercentage: 100
# Nudge it clear of the tab bar (the bottom edge counts as visible behind it).
- swipe:
    start: "50%,60%"
    end: "50%,40%"
    duration: 600
- tapOn:
    id: "settings-agent-save"
- extendedWaitUntil:
    visible: ".*Agent settings saved.*"
    timeout: 10000
- takeScreenshot: w4-settings-saved
- scrollUntilVisible:
    element:
      id: "settings-backup"
    direction: DOWN
    visibilityPercentage: 100
    # A long page: scroll faster (on Android each default-speed swipe moves it little and takes seconds).
    speed: 80
    timeout: 90000
# Nudge it clear of the tab bar (the bottom edge counts as visible behind it).
- swipe:
    start: "50%,60%"
    end: "50%,40%"
    duration: 600
- tapOn:
    id: "settings-backup"
# The warning that the share target receives every secret in the backup (F-56); then owner re-authentication, which
# passes on a simulator with no passcode.
- extendedWaitUntil:
    visible:
      id: "settings-backup-confirm-confirm"
    timeout: 10000
- takeScreenshot: w4-backup-warning
- tapOn:
    id: "settings-backup-confirm-confirm"
- runFlow:
    when:
      platform: iOS
    commands:
      # The simulator has a passcode, so the export first asks the owner to confirm it is them (F-56). Maestro
      # cannot enter it: check the prompt and that cancelling exports nothing.
      # The passcode sheet is system UI outside the app's view hierarchy: wait for it to settle, record it, close it.
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: w4-backup-reauth
      - tapOn:
          point: "9%,11%"
      - extendedWaitUntil:
          visible: ".*Backup cancelled.*"
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: ".*armada-backup.*|Share|.*zip.*"
          timeout: 20000
      - takeScreenshot: w4-backup-share-sheet
      - back
- extendedWaitUntil:
    visible:
      id: "settings-server"
    timeout: 10000
- tapOn:
    id: "tab-more"
